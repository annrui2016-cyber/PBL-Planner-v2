<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 项目式学习 (PBL) 设计助手</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #357abd;
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
            line-height: 1.6;
            white-space: pre-wrap; /* 保持 AI 输出的换行格式 */
        }
        .loading {
            color: #666;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 PBL 项目设计助手</h1>
    
    <div class="input-group">
        <label for="theme">项目主题</label>
        <input type="text" id="theme" placeholder="例如：保护当地水源、未来的城市...">
    </div>

    <div class="input-group">
        <label for="subject">关联学科</label>
        <input type="text" id="subject" placeholder="例如：科学、社会、数学...">
    </div>

    <div class="input-group">
        <label for="grade">适用年级</label>
        <input type="text" id="grade" placeholder="例如：小学四年级、初二...">
    </div>

    <div class="input-group">
        <label for="duration">预计时长</label>
        <input type="text" id="duration" placeholder="例如：4周、一个学期...">
    </div>

    <button onclick="generatePBL()">✨ 生成 PBL 方案</button>

    <div id="result">方案将在此处显示...</div>
</div>

<script>
    async function generatePBL() {
        const theme = document.getElementById('theme').value;
        const subject = document.getElementById('subject').value;
        const grade = document.getElementById('grade').value;
        const duration = document.getElementById('duration').value;
        const resultDiv = document.getElementById('result');

        if (!theme) {
            alert('请输入项目主题');
            return;
        }

        resultDiv.innerHTML = '<p class="loading">正在为您构思精妙的 PBL 方案，请稍候... (大约需要 10-20 秒)</p>';

        // 💡 这里填入你那串以 sk-or-v1- 开头的 OpenRouter Key
        const OPENROUTER_KEY = "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";

        const promptText = `你是一位资深的 PBL（项目式学习）专家。
        请为我设计一个高质量的项目式学习方案：
        主题：${theme}
        学科：${subject}
        年级：${grade}
        持续时长：${duration}
        
        要求输出结构清晰，包含以下模块：
        1. 项目概述
        2. 驱动问题 (Driving Question)
        3. 核心学习目标 (标准对齐)
        4. 关键活动步骤
        5. 最终成果展示
        6. 评价建议
        请使用中文回答。`;

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${OPENROUTER_KEY}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": "https://vercel.com", // OpenRouter 要求的标识
                    "X-Title": "FangZhou_PBL_Planner"
                },
                body: JSON.stringify({
                    "model": "google/gemini-flash-1.5", 
                    "messages": [{ "role": "user", "content": promptText }],
                    "temperature": 0.7
                })
            });

            const data = await response.json();
            
            if (data.choices && data.choices[0]) {
                const content = data.choices[0].message.content;
                // 将 Markdown 风格的标题和列表简单转化为 HTML 格式显示
                resultDiv.innerHTML = `<h2>方案建议</h2><div style="text-align: left;">${content.replace(/\n/g, '<br>')}</div>`;
            } else {
                resultDiv.innerHTML = `<p style="color:red">生成失败，请检查 Key 或网络。错误信息：${JSON.stringify(data.error || data)}</p>`;
            }
        } catch (error) {
            resultDiv.innerHTML = `<p style="color:red">网络请求异常：${error.message}</p>`;
        }
    }
</script>

</body>
</html>
